[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "kiroops-backend"
version = "0.1.0"
description = "KiroOps incident-management backend: FastAPI service, MCP tools, and diagnosis agent."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.100",
    "httpx>=0.27",
    # In-memory AWS mocks for the DynamoDB repository tests (no Docker needed).
    "boto3>=1.34",
    "moto[dynamodb]>=5",
]
# Optional: enables the real Amazon Bedrock (Nova) LLM provider for live
# diagnosis. Not part of the core dependencies so the backend and its tests run
# without boto3 installed.
bedrock = [
    "boto3>=1.34",
]
# Optional: AWS Lambda adapter. Only the Lambda packaging/deploy needs this, so
# it stays out of the core dependencies (the handler in backend.lambda_handler
# imports it, and no test in the suite imports that module).
lambda = [
    "mangum>=0.17",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["backend*"]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-ra"
